---
# Postora sajat image build.
#
# MIERT VAN EZ. A hivatalos ghcr.io/gitroomhq/postiz-app image tartalmazza a
# TikTok Content Sharing UX Guidelines megsertesét (upstream #1563, nyitva
# 2026-05-26 ota). A javitas a fix/tiktok-content-sharing-ux-guidelines agon
# van, es amig upstream be nem kerul, sajat image-et kell gyartanunk.
#
# MIERT ITT FUT ES NEM A SZERVEREN. A celgep egy 4 GB RAM-os VPS, amin a Postiz
# es a Temporal is fut. Egy Next.js build ott konnyen elfogyaszthatna a
# memoriat, es kozben a szolgaltatas is akadna. A GitHub futtatoja ingyenes,
# nagyobb, es a szervernek csak a kesz image-et kell lehuznia.
#
# CSAK AMD64. A celgep x86, arm64-re nincs szukseg, es a fele epitesi ido.

name: Postora image

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'fix/**'

concurrency:
  # Egy agon egyszerre egy build. Egy ujabb push feleslegesse teszi a futot.
  group: postora-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # A build elott lefuttatjuk a UX-guidelines ellenorzest. Ha egy upstream
      # merge csendben visszahozza az alapertelmezett privacy erteket, itt
      # bukjon el, ne hetekkel kesobb a TikTok auditjan.
      - name: TikTok UX Guidelines ellenorzes
        run: node tools/tiktok-ux-guidelines-check.mjs

      # A .svg favicon minden mai bongeszoben nyer, de a regi klienseknek es
      # az iOS kezdolapnak raszter kell. A futtatonál van ImageMagick, tehát
      # ugyanabbol az SVG-bol gyartjuk mindkettot -- igy nem tud szetcsuszni a
      # jel a kulonbozo meretek kozott.
      - name: Favicon raszterizalas az SVG-bol
        run: |
          # rsvg-convert az SVG->PNG lepesre, NEM az ImageMagick sajat SVG
          # rajzoloja: az utobbi a clipPath-ot figyelmen kivul hagyja, es a
          # jelbol egy szintelen negyzet lenne. Az ImageMagick csak a kesz
          # PNG-kbol rakja ossze az .ico-t.
          # Az ImageMagick nincs eleve a kepen, ezert telepitjuk.
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin imagemagick
          SRC=apps/frontend/public/favicon.svg
          test -f "$SRC"
          rsvg-convert -w 180 -h 180 "$SRC" -o apps/frontend/public/favicon.png
          for s in 16 32 48; do
            rsvg-convert -w $s -h $s "$SRC" -o "/tmp/fav-$s.png"
          done
          # Az ImageMagick binaris neve verziofuggo: a 7-e magick, a 6-e
          # convert. Az ubuntu-latest csomagja a 6-os, de ezt nem erdemes
          # beegetni -- ha a kep valaha 7-re valt, ez a lepes nemán tovabb megy.
          IM="$(command -v magick || command -v convert)"
          test -n "$IM" || { echo "nincs ImageMagick"; exit 1; }
          "$IM" /tmp/fav-16.png /tmp/fav-32.png /tmp/fav-48.png apps/frontend/public/favicon.ico
          ls -la apps/frontend/public/favicon.*
          file apps/frontend/public/favicon.ico apps/frontend/public/favicon.png

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Cimkek szamitasa
        id: meta
        run: |
          REPO_LC=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${REPO_LC}" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build es push
        run: |
          docker buildx build --platform linux/amd64 \
            -f Dockerfile.dev \
            -t ${{ steps.meta.outputs.image }}:latest \
            -t ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha }} \
            --build-arg NEXT_PUBLIC_VERSION=postora-${{ steps.meta.outputs.sha }} \
            --provenance=false --sbom=false \
            --push .

      - name: Osszefoglalo
        run: |
          {
            echo "### Postora image kesz"
            echo ""
            echo "- \`${{ steps.meta.outputs.image }}:latest\`"
            echo "- \`${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha }}\`"
            echo ""
            echo "A szerveren: \`docker compose pull postiz && docker compose up -d postiz\`"
          } >> "$GITHUB_STEP_SUMMARY"
