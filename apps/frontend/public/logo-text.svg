<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 48" width="210" height="48" role="img" aria-label="Postora">
  <!--
    Jel + szomarka. A szoveg rendszer-betutipussal keszul: a felulet sajat
    betukeszlete nem garantalt egy SVG-n belul, es egy hianyzo webfont miatt
    elcsuszo logo rosszabb, mint egy tiszta rendszerbetu.
  -->
  <defs>
    <clipPath id="postora-card-text">
      <rect x="1" y="4" width="30" height="40" rx="4.5" ry="4.5"/>
    </clipPath>
  </defs>
  <g clip-path="url(#postora-card-text)">
    <rect x="1" y="4" width="30" height="40" fill="#2F4FC0"/>
    <rect x="1" y="4" width="30" height="13.6" fill="#D9A227"/>
  </g>
  <rect x="1" y="4" width="30" height="40" rx="4.5" ry="4.5" fill="none" stroke="#2F4FC0" stroke-width="2"/>
  <text x="44" y="33"
        font-family="Bricolage Grotesque, Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif"
        font-size="30" font-weight="800" letter-spacing="-0.8" fill="currentColor">Postora</text>
</svg>
