<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="Postora">
  <!--
    NÉGYZETES változat, szándékosan külön a logo.svg-től.

    A logó 3:4 arányú álló kártya, mert az egy videó formája. Egy favicon
    helye viszont négyzet: ha az álló alakzatot tennénk oda, a böngésző
    letterboxolná, és 16 pixelen egy sovány csík maradna belőle. Ezért a
    kártya itt egy négyzetbe van komponálva, kicsit zömökebb aránnyal, hogy
    kis méretben is tömör folt legyen.

    Ugyanaz a két szín és ugyanaz a felső okker sáv, tehát egy család.
  -->
  <defs>
    <clipPath id="postora-favicon-card">
      <rect x="11" y="5" width="26" height="38" rx="5" ry="5"/>
    </clipPath>
  </defs>
  <g clip-path="url(#postora-favicon-card)">
    <rect x="11" y="5" width="26" height="38" fill="#2F4FC0"/>
    <rect x="11" y="5" width="26" height="12.9" fill="#D9A227"/>
  </g>
</svg>
