<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 48" width="36" height="48" role="img" aria-label="Postora">
  <!--
    A Postora jele: egy alló kártya, a felső harmadán okker sávval.

    Ugyanaz az alakzat, ami a postora.zsomborvarsanyi.com fejlécében áll, csak
    ott kontúrosan, világos papíron. Itt kitöltve, mert az alkalmazás háttere
    sötét, és favicon méretben (16px) egy vékony kontúr szétesne.

    Miért ez az alakzat: 3:4 arányú álló keret, vagyis egy videó formája, és
    a felső sáv a jelölés, hogy be van ütemezve. A termék egy mondatban.
  -->
  <defs>
    <clipPath id="postora-card">
      <rect x="1" y="1" width="34" height="46" rx="5" ry="5"/>
    </clipPath>
  </defs>
  <g clip-path="url(#postora-card)">
    <rect x="1" y="1" width="34" height="46" fill="#2F4FC0"/>
    <!-- A sáv a magasság 34%-a, egyezően a weboldal fejlécének jelével. -->
    <rect x="1" y="1" width="34" height="15.6" fill="#D9A227"/>
  </g>
  <rect x="1" y="1" width="34" height="46" rx="5" ry="5" fill="none" stroke="#2F4FC0" stroke-width="2"/>
</svg>
